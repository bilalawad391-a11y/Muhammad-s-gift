<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عيد ميلاد محمد ❤️</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width;
let height;
let screenScale;

const DPR = Math.min(
    window.devicePixelRatio || 1,
    3
);


// ======================================
// جودة الشاشة
// ======================================

function resize() {

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * DPR;
    canvas.height = height * DPR;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    screenScale =
        Math.min(width, height) / 620;
}

resize();

window.addEventListener(
    "resize",
    resize
);


// ======================================
// نقاط القلب
// ======================================

const points = [];

for (
    let scale = 12;
    scale <= 18;
    scale += 0.07
) {

    for (
        let i = 0;
        i < 150;
        i++
    ) {

        const angle =
            (Math.PI * 2 / 150) * i;

        const x =
            16 *
            Math.pow(
                Math.sin(angle),
                3
            ) *
            scale;

        const y =
            (
                13 * Math.cos(angle)
                - 5 * Math.cos(2 * angle)
                - 2 * Math.cos(3 * angle)
                - Math.cos(4 * angle)
            ) *
            scale;

        points.push({
            x: x,
            y: -y
        });
    }
}


// ======================================
// سرعة تكوين القلب
// ======================================

let progress = 0;

let lastTime =
    performance.now();

const HEART_SPEED =
    0.045;


// ======================================
// القلوب الصغيرة المتحركة
// ======================================

const floatingHearts = [];

for (let i = 0; i < 35; i++) {

    floatingHearts.push({

        x: Math.random(),

        y: Math.random(),

        size:
            9 +
            Math.random() * 16,

        speed:
            0.00012 +
            Math.random() * 0.00025,

        time:
            Math.random() *
            Math.PI * 2
    });
}


// ======================================
// المعايدة داخل القلب
// ======================================

function drawBirthdayMessage() {

    ctx.save();

    // مكان المعايدة
    // نازلة لتحت شوية عن مركز القلب

    ctx.translate(
        width / 2,
        height / 2 + 15
    );

    ctx.scale(
        screenScale,
        screenScale
    );

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    // خط واضح وعالي الجودة

    ctx.font =
        "bold 15px Arial, Tahoma, sans-serif";


    const lines = [

        "كل سنة وانت حبيبي",

        "وصاحب عمري ورفيق دربي 🫂❤️",

        "كل سنة وانت سندي",

        "وأماني ومأمني 🫶🫂",

        "كل سنة وانت اغلى الغوالي",

        "يديمك ليا صاحب وصديق",

        "وزوج صالح العمر كله يارب",

        "🤲🫶🫂🫂❤️"

    ];


    const lineHeight =
        25;


    // بداية المعايدة

    const startY =
        -82;


    lines.forEach(
        (line, index) => {

            const y =
                startY +
                index * lineHeight;


            ctx.shadowColor =
                "rgba(255, 23, 68, 0.85)";

            ctx.shadowBlur =
                5;


            ctx.fillStyle =
                "#ffffff";


            ctx.fillText(
                line,
                0,
                y
            );

        }
    );

    ctx.restore();
}


// ======================================
// الأنيميشن
// ======================================

function animate(time) {

    const delta =
        Math.min(
            40,
            time - lastTime
        );

    lastTime =
        time;


    progress +=
        delta *
        HEART_SPEED;


    if (
        progress >
        points.length
    ) {

        progress =
            points.length;
    }


    // ==================================
    // الخلفية
    // ==================================

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    // ==================================
    // القلوب الصغيرة
    // ==================================

    for (
        const heart
        of floatingHearts
    ) {

        heart.y -=
            heart.speed *
            delta;

        heart.time +=
            delta *
            0.002;


        if (
            heart.y <
            -0.1
        ) {

            heart.y =
                1.1;

            heart.x =
                Math.random();
        }


        const opacity =
            (
                Math.sin(
                    heart.time * 2
                ) + 1
            ) / 2;


        ctx.save();

        ctx.globalAlpha =
            opacity * 0.75;

        ctx.fillStyle =
            "#ff6b91";

        ctx.font =
            `${heart.size}px Arial`;

        ctx.shadowColor =
            "#ff1744";

        ctx.shadowBlur =
            12;


        ctx.fillText(
            "♥",
            heart.x * width,
            heart.y * height
        );

        ctx.restore();
    }


    // ==================================
    // القلب الرئيسي
    // ==================================

    ctx.save();

    ctx.translate(
        width / 2,
        height / 2 - 20
    );

    ctx.scale(
        screenScale,
        screenScale
    );


    ctx.font =
        "bold 7px Georgia";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    const amount =
        Math.floor(
            progress
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const point =
            points[i];


        ctx.fillStyle =
            "#ffb6c1";

        ctx.shadowColor =
            "#ff6f91";

        ctx.shadowBlur =
            3;


        ctx.fillText(
            "I Love You",
            point.x,
            point.y
        );
    }


    ctx.restore();


    // ==================================
    // المعايدة تظهر من البداية
    // ==================================

    drawBirthdayMessage();


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);

</script>

</body>
  </html>
